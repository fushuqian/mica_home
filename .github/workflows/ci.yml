name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: 格式检查
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race ./...
