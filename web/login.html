<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN · Mica Home</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:color-mix(in srgb,var(--mh-accent) 22%,transparent)}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(180deg,var(--mh-bg-1) 0%,var(--mh-bg-2) 58%,var(--mh-bg-3) 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
.blob.b1{width:560px;height:560px;left:-160px;top:-200px;background:var(--mh-blob-1)}
.blob.b2{width:500px;height:500px;right:-140px;bottom:-160px;background:var(--mh-blob-2)}
.card{
  width:min(420px,100%);padding:34px 32px 30px;border-radius:20px;
  background:linear-gradient(150deg,var(--glass-2),var(--glass));
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--mh-glass-border);
  box-shadow:inset 0 1px 0 var(--mh-inset),var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.brand svg{flex:none}
.brand b{font-family:var(--font-d);font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-family:var(--font-m);font-size:10.5px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
.mono{font-family:var(--font-m);font-size:12.5px}
h1{margin:0;font-family:var(--font-d);font-size:23px;letter-spacing:-.02em}
.hint{margin-top:8px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
label{display:block;margin-top:22px;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
input{
  width:100%;margin-top:7px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--mh-soft);color:var(--ink);
  font:inherit;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--mh-accent);box-shadow:0 0 0 3px var(--mh-accent-line)}
button{
  width:100%;margin-top:18px;padding:11px;border-radius:10px;border:1px solid var(--ink);
  background:var(--ink);color:var(--mh-bg);font:inherit;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .2s var(--ease);
}
button:hover{opacity:.9}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
.error{margin-top:14px;font-size:12.5px;color:var(--mh-warn-text)}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div></div>

<main class="card">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <rect x="2.5" y="2.5" width="11" height="11" rx="3.5" fill="currentColor"/>
      <rect x="16.5" y="2.5" width="11" height="11" rx="3.5" fill="var(--mh-accent)"/>
      <rect x="2.5" y="16.5" width="11" height="11" rx="3.5" stroke="currentColor" stroke-width="1.4"/>
      <rect x="16.5" y="16.5" width="11" height="11" rx="3.5" fill="currentColor" opacity=".22"/>
    </svg>
    <b>Mica Home</b><span>Modular Shell</span>
  </div>

  <h1>登录</h1>
  <p class="hint">输入管理员口令。若未设置 <span class="mono">MICA_ADMIN_PASSWORD</span>，首次启动生成的口令保存在数据目录 <span class="mono">/data/auth/password</span>。</p>

  <form id="login-form">
    <label for="password">管理口令</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">进入</button>
  </form>
  <p class="error" id="error" role="alert" hidden></p>
</main>

<script>
const form = document.getElementById('login-form');
const pwd = document.getElementById('password');
const err = document.getElementById('error');
const btn = document.getElementById('submit');

fetch('/api/auth/session')
  .then(r => r.json())
  .then(d => { if (d.authenticated) location.href = '/'; })
  .catch(() => {});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true;
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd.value })
    });
    if (res.ok) { location.href = '/'; return; }
    let msg = '登录失败';
    try { msg = (await res.json()).error || msg; } catch {}
    if (res.status === 429) msg = '尝试过于频繁，请稍后再试';
    err.textContent = msg;
    err.hidden = false;
    pwd.select();
  } catch {
    err.textContent = '无法连接宿主，请确认服务已启动';
    err.hidden = false;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
